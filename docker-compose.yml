
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recados-backend
    env_file:
      - ./backend/.env
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
    volumes:
      - ./backend:/var/www
      - ./backend/vendor:/var/www/vendor
      - anexos_recados:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recados-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: mysql:8.0
    container_name: recados-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-site_recados}
      MYSQL_USER: ${DB_USERNAME:-recados}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - dados_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

volumes:
  dados_mysql:
  anexos_recados:
